<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Simple</title>
</head>
<body>
    <h1>Test de Lectura Directa</h1>
    <input type="file" id="fileInput" accept=".csv">
    <div id="resultado" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const texto = await file.text();
            const lineas = texto.split(/\r?\n/);
            
            // Buscar encabezado
            let filaEnc = -1;
            for (let i = 0; i < 20; i++) {
                if (lineas[i] && lineas[i].trim().startsWith('Centro,')) {
                    filaEnc = i;
                    break;
                }
            }
            
            if (filaEnc === -1) {
                document.getElementById('resultado').textContent = 'No se encontró encabezado';
                return;
            }
            
            const columnas = lineas[filaEnc].split(',');
            const lineasDatos = [];
            
            for (let i = filaEnc + 1; i < lineas.length; i++) {
                const linea = lineas[i].trim();
                if (linea === '') continue;
                lineasDatos.push(linea);
            }
            
            let resultado = `ANÁLISIS DIRECTO\n`;
            resultado += `================\n\n`;
            resultado += `Encabezado en línea: ${filaEnc}\n`;
            resultado += `Columnas: ${columnas.length}\n`;
            resultado += `Líneas de datos no vacías: ${lineasDatos.length}\n\n`;
            
            // Analizar cada línea
            let ok = 0, mas = 0, menos = 0;
            const ejemplosMas = [];
            
            lineasDatos.forEach((linea, idx) => {
                const campos = linea.split(',');
                if (campos.length === columnas.length) ok++;
                else if (campos.length > columnas.length) {
                    mas++;
                    if (ejemplosMas.length < 3) {
                        ejemplosMas.push({
                            num: idx + filaEnc + 2,
                            campos: campos.length,
                            linea: linea.substring(0, 150)
                        });
                    }
                } else menos++;
            });
            
            resultado += `Filas con ${columnas.length} campos: ${ok}\n`;
            resultado += `Filas con MÁS campos: ${mas}\n`;
            resultado += `Filas con MENOS campos: ${menos}\n`;
            resultado += `\nTOTAL: ${ok + mas + menos}\n`;
            resultado += `CREDIBILIDAD MÁXIMA POSIBLE: ${((ok + mas) / lineasDatos.length * 100).toFixed(1)}%\n\n`;
            
            if (ejemplosMas.length > 0) {
                resultado += `\nEJEMPLOS de filas con campos extra:\n`;
                resultado += `====================================\n\n`;
                ejemplosMas.forEach(e => {
                    resultado += `Línea ${e.num} (${e.campos} campos):\n`;
                    resultado += `${e.linea}...\n\n`;
                });
            }
            
            // Verificar si la reagrupación funcionaría
            const idxObs = columnas.findIndex(c => c.trim().toLowerCase().includes('observacion'));
            resultado += `\nÍndice columna Observaciones: ${idxObs}\n`;
            
            if (idxObs !== -1 && mas > 0) {
                let recuperables = 0;
                lineasDatos.forEach(linea => {
                    const campos = linea.split(',');
                    if (campos.length > columnas.length) {
                        const sobrantes = campos.length - columnas.length;
                        const antes = campos.slice(0, idxObs);
                        const textoRearmado = campos.slice(idxObs, idxObs + sobrantes + 1).join(',');
                        const despues = campos.slice(idxObs + sobrantes + 1);
                        const reagrupados = [...antes, textoRearmado, ...despues];
                        
                        if (reagrupados.length === columnas.length) {
                            recuperables++;
                        }
                    }
                });
                
                resultado += `Filas recuperables reagrupando: ${recuperables}\n`;
                resultado += `\n🎯 CREDIBILIDAD CON REAGRUPACIÓN: ${((ok + recuperables) / lineasDatos.length * 100).toFixed(1)}%\n`;
            }
            
            document.getElementById('resultado').textContent = resultado;
        });
    </script>
</body>
</html>
