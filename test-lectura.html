<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Lectura CSV</title>
</head>
<body>
    <h1>Test de Lectura del Reporte de Tiempos Muertos</h1>
    <input type="file" id="fileInput" accept=".csv">
    <div id="resultado" style="margin-top: 20px; font-family: monospace;"></div>

    <script src="diagnostico-completo.js"></script>
    <script>
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const texto = await file.text();
            const resultado = document.getElementById('resultado');
            
            // Análisis básico
            const lineas = texto.split('\n');
            resultado.innerHTML = `
                <h2>Análisis del archivo: ${file.name}</h2>
                <p><strong>Total de líneas:</strong> ${lineas.length}</p>
                <p><strong>Primeras 15 líneas:</strong></p>
                <pre>${lineas.slice(0, 15).map((l, i) => `${i}: ${l}`).join('\n')}</pre>
                <hr>
                <h3>Buscando fila de encabezados...</h3>
            `;

            // Buscar encabezado
            let filaEncabezado = -1;
            for (let i = 0; i < Math.min(20, lineas.length); i++) {
                if (lineas[i].trim().startsWith('Centro,')) {
                    filaEncabezado = i;
                    break;
                }
            }

            if (filaEncabezado === -1) {
                resultado.innerHTML += '<p style="color: red;">❌ No se encontró la fila de encabezados</p>';
                return;
            }

            resultado.innerHTML += `
                <p style="color: green;">✅ Encabezado encontrado en línea ${filaEncabezado}</p>
                <p><strong>Encabezado:</strong></p>
                <pre>${lineas[filaEncabezado]}</pre>
            `;

            // Contar columnas del encabezado
            const columnas = lineas[filaEncabezado].split(',');
            resultado.innerHTML += `<p><strong>Columnas detectadas:</strong> ${columnas.length}</p>`;
            resultado.innerHTML += `<ul>${columnas.map(c => `<li>${c.trim()}</li>`).join('')}</ul>`;

            // Contar líneas de datos
            const lineasDatos = lineas.slice(filaEncabezado + 1).filter(l => l.trim() !== '');
            resultado.innerHTML += `
                <h3>Líneas de datos</h3>
                <p><strong>Total líneas de datos (no vacías):</strong> ${lineasDatos.length}</p>
            `;

            // Analizar cada línea de datos
            let lineasValidas = 0;
            let lineasInvalidas = 0;
            let problemas = [];

            lineasDatos.forEach((linea, i) => {
                const campos = linea.split(',');
                if (campos.length === columnas.length) {
                    lineasValidas++;
                } else {
                    lineasInvalidas++;
                    if (problemas.length < 10) {
                        problemas.push(`Línea ${filaEncabezado + i + 2}: ${campos.length} campos (esperados: ${columnas.length})`);
                    }
                }
            });

            resultado.innerHTML += `
                <p style="color: ${lineasInvalidas === 0 ? 'green' : 'orange'};">
                    <strong>Líneas válidas:</strong> ${lineasValidas} (${((lineasValidas/lineasDatos.length)*100).toFixed(1)}%)
                </p>
                <p style="color: ${lineasInvalidas === 0 ? 'green' : 'red'};">
                    <strong>Líneas con problemas:</strong> ${lineasInvalidas}
                </p>
            `;

            if (problemas.length > 0) {
                resultado.innerHTML += `
                    <h4>Ejemplos de líneas problemáticas:</h4>
                    <pre>${problemas.join('\n')}</pre>
                `;
            }

            // Verificar campos vacíos
            let registrosConDatos = 0;
            let registrosVacios = 0;

            lineasDatos.forEach(linea => {
                const campos = linea.split(',');
                const tieneAlgunDato = campos.some(c => c.trim() !== '');
                if (tieneAlgunDato) {
                    registrosConDatos++;
                } else {
                    registrosVacios++;
                }
            });

            resultado.innerHTML += `
                <hr>
                <h3>Análisis de contenido</h3>
                <p><strong>Registros con datos:</strong> ${registrosConDatos}</p>
                <p><strong>Registros vacíos:</strong> ${registrosVacios}</p>
            `;

            // Mostrar primeros 5 registros
            resultado.innerHTML += `
                <hr>
                <h3>Primeros 5 registros de datos:</h3>
                <table border="1" cellpadding="5" style="font-size: 11px; border-collapse: collapse;">
                    <tr>${columnas.map(c => `<th>${c}</th>`).join('')}</tr>
                    ${lineasDatos.slice(0, 5).map(linea => {
                        const campos = linea.split(',');
                        return `<tr>${campos.map(c => `<td>${c}</td>`).join('')}</tr>`;
                    }).join('')}
                </table>
            `;
        });
    </script>
</body>
</html>
